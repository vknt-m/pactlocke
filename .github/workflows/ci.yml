name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # The determinism check must run in CI, never skip for a missing ROM.
  PACTLOCKE_REQUIRE_TEST_ROM: "1"

jobs:
  no-game-files:
    name: No ROMs, saves or patches committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refuse game files
        run: |
          found="$(git ls-files | grep -iE '\.(gba|agb|gb|gbc|nds|sav|srm|sgm|ss[0-9]|state|ips|ups|bps|xdelta)$' || true)"
          if [ -n "$found" ]; then
            echo "Game files must never be committed:"; echo "$found"; exit 1
          fi

  build:
    name: Build and test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows x86-64, os: windows-latest }
          - { name: Linux x86-64, os: ubuntu-latest }
          - { name: macOS Apple Silicon, os: macos-latest }
          - { name: macOS Intel, os: macos-15-intel }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Check the libmgba pin
        shell: bash
        run: test "$(git -C third_party/mgba rev-parse HEAD)" = 662dada8b79070bde93829a44d583c517fc5ec2d

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libx11-dev \
            libxcursor-dev libxrandr-dev libxi-dev mesa-vulkan-drivers xvfb

      - name: Formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Fetch the test ROMs (jsmolka gba-tests arm.gba and thumb.gba, MIT)
        shell: bash
        run: bash scripts/fetch-test-rom.sh

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests, including the determinism check
        run: cargo test --workspace

      # The core must read its clock as UTC and hash identically in any zone.
      - name: Core tests in other time zones (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          TZ=Pacific/Kiritimati cargo test -p pactlocke-mgba
          TZ=America/Los_Angeles cargo test -p pactlocke-mgba
      - name: Core tests in other time zones (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          tzutil /s "Line Islands Standard Time"
          cargo test -p pactlocke-mgba
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          tzutil /s "Pacific Standard Time"
          cargo test -p pactlocke-mgba
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          tzutil /s "UTC"

      - name: Build the app
        run: cargo build -p pactlocke-app

      - name: Smoke launch with no ROM (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a target/debug/pactlocke --smoke
      - name: Smoke launch with no ROM
        if: runner.os != 'Linux'
        shell: bash
        run: target/debug/pactlocke --smoke
