# Pokémon Gaia 3.2 by Spherical Ice, a binary hack of FireRed (USA) 1.0.
# It keeps FireRed's battle RAM, party, save blocks, event flags and most
# patch sites (checked by `cargo dev scan`), but stores Pokémon unencrypted in a fixed order, keeps the Bag in RAM
# outside the save blocks, has 935 species with moved species tables, and
# refuses the Bag in battle by its own flag 0x280 instead of FireRed's mask.
# Its Areas, Gifts, Statics and leaders are its own, read from this ROM.

schema = 1
id = "gaia-3.2"
name = "Pokémon Gaia 3.2"
game_code = "BPRE"
family = "FRLG"
sha1 = "d5b1e77975fcda831e0e9a7b527906bf3f40ecd0"
status = "supported"

[symbols]
party = 0x02024284
party_count = 0x02024029
enemy_party = 0x0202402C              # gEnemyParty
pc_storage = { pointer = 0x03005010 }
save_block_1 = { pointer = 0x03005008 }
save_block_2 = { pointer = 0x0300500C }
region_map_section = 0x02036E10        # gMapHeader.regionMapSectionId
main_callback2 = 0x030030F4            # gMain.callback2
overworld_callback = 0x080565B4        # CB2_Overworld
in_battle = { at = 0x03003529, mask = 0x02 }   # gMain.inBattle
battle_type_flags = 0x02022B4C
battle_mons = 0x02023BE4
battler_party_indexes = 0x02023BCE
battler_statuses3 = 0x02023DFC
disable_structs = 0x02023E0C
script_context_status = 0x03000EA8     # 0 running, 1 waiting, 2 idle
script_context = 0x03000EB0
species_info = 0x08ACD000
species_names = 0x08745850              # gSpeciesNames
evolution_table = 0x08A9556C            # gEvolutionTable
items = 0x083DB028
trainers = 0x0823EAC8                   # gTrainers
type_names = 0x087FFE00                 # gTypeNames
message_buffer = 0x02021D18             # gStringVar4
# Gaia keeps the Bag in RAM, outside save block 1 (its SetBagPocketsPointers).
balls_pocket = 0x0203C8C0

[layout]
# How a Pokémon is stored (pret's struct Pokemon / BoxPokemon).
party_slot_size = 100
box_slot_size = 80
encrypted = false
ot_id = 0x04
nickname = 0x08
nickname_length = 10
flags = 0x13
egg_mask = 0x04
has_species_mask = 0x02
checksum = 0x1C
substructures = 0x20
level = 0x54
hp = 0x56
max_hp = 0x58
battle_mon_size = 0x58
battle_mon_hp = 0x28
battle_type_trainer = 0x08
# BATTLE_TYPE_OLD_MAN_TUTORIAL, _GHOST and _POKEDUDE: the catching demo, the
# Pokémon Tower ghost and the Pokédude's demos, which nobody can catch in.
battle_type_uncatchable = 0x18200
battle_type_double = 0x01
perish_song_status3 = 0x20
disable_struct_size = 0x1C
perish_timer = 0x0F
script_context_stack_depth = 0x00
script_context_stack = 0x0C
script_context_pointer = 0x08
species_info_size = 28
species_name_length = 11
species_count = 935                     # NUM_SPECIES
evolutions_per_species = 16              # EVOS_PER_MON
evolution_size = 8                      # struct Evolution
evolution_target = 4
primary_type = 6
item_size = 44
item_count = 375
item_pocket = 26
item_battle_usage = 32
ball_pocket = 3
pc_boxes = 14
pc_box_slots = 30
pc_boxes_offset = 4
trainer_id = 0x0A                      # in save block 2
play_time = 0x0E                       # in save block 2: hours, minutes, seconds, frames
badge_flags = 0x820                    # FLAG_BADGE01_GET: eight flags, one per badge
event_flags = 0xEE0                    # in save block 1
# pret's struct Trainer (40 bytes) and its party entries; the party flags say
# whether entries carry custom moves (16 bytes) or not (8 bytes).
trainer_size = 40
trainer_party_flags = 0
trainer_party_size = 32
trainer_party = 36
trainer_mon_level = 2
trainer_mon_sizes = [8, 16, 8, 16]
type_name_length = 7
balls_pocket = 0x430                   # in save block 1: gBagPockets' Poké Balls
balls_pocket_slots = 28
dead_box = 14

[options.battle_style]
name = "Battle style"
menu = "OPTION > BATTLE STYLE"
save_block = 2
offset = 0x15
mask = 0x02
values = { shift = 0x00, set = 0x02 }

# Closes an Area: the ball is refused in the Bag with Oak's "time and place" line.
[rules.catch_block]
method = "patch"
sites = [
  { at = 0x08040F6C, expect = "10 B5 00 24", write = "01 20 70 47" },  # IsPlayerPartyAndPokemonStorageFull -> TRUE
  { at = 0x080A1E5C, expect = "31 66 41 08", write = "25 64 41 08" },  # gText_BoxFull -> "This isn't the time to use that!"
]

# The level-100 checks after `movs r1, #0x38` (MON_DATA_LEVEL); the first byte is the cap.
[rules.level_cap]
method = "patch"
sites = [
  { at = 0x08021FB6, expect = "64 28" },  # Cmd_getexp
  { at = 0x08041834, expect = "64 28" },  # PokemonUseItemEffects (Rare Candy)
  { at = 0x0804274E, expect = "64 28" },  # PokemonItemUseNoEffect
]

# BATTLE_TYPE_TRAINER added to the "items can't be used" mask in HandleTurnActionSelectionState.
[rules.no_items_trainer]
method = "patch"
sites = [
  # FlagGet(0x280), Gaia's own "no items" flag -> gBattleTypeFlags & BATTLE_TYPE_TRAINER, as FireRed tests its mask
  { at = 0x080143D4, expect = "0E 48 5A F0 7B F9 25 D0 C0 46 C0 46", write = "0E 48 00 68 08 21 08 40 24 D0 C0 46" },
  { at = 0x08014410, expect = "80 02 00 00", write = "4C 2B 02 02" },  # its literal: 0x280 -> gBattleTypeFlags
]

# Only Poké Balls keep a battle use in wild battles.
[rules.no_items_wild]
method = "zero_table_field"

[rules.set_mode]
method = "option_bit"
option = "battle_style"
value = "set"

# "Give a nickname?" is answered Yes: B and Down are dropped while the battle script waits on
# trygivecaughtmonnick and its Yes/No box is up.
[rules.must_nickname]
method = "key_filter"
battle_script_pointer = 0x02023D74   # gBattlescriptCurrInstr
command_table = 0x0825011C           # gBattleScriptingCommandsTable
command = 0x0802DD39                 # Cmd_trygivecaughtmonnick
battle_communication = 0x02023E82
# On the overworld (a Gift's "Do you want to give a nickname…?"): the shared MSGBOX_YESNO script
# waits here, just after its yesnobox, while its box is up. "give a nickname" leaves out the
# Name Rater's "rate the nicknames".
field_yes_no = [0x081A4E65]
question = "give a nickname"

