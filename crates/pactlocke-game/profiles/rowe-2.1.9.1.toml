# Pokémon R.O.W.E. 2.1.9.1 Experimental by Rioluwott, built on a pre-1.0
# pokeemerald-expansion and rewritten since; its full source isn't public.
# Its RAM, tables and scripts were read from this ROM and its RAM:
# - Pokémon are its own plain, unencrypted form: 0x4C bytes in the party and
#   0x34 in the PC, the species in the low 12 bits at +0x1C, the egg bit at
#   +0x27 (0x80) and the met location at +0x2A. Battlers are 0x60 bytes.
# - Its 1883 species (forms among them) keep 0x40 bytes of info with the
#   types at +0x0C in the original numbering, and 13-byte names.
# - It makes its trainers' teams and levels as the Player goes, so each cap
#   stage's default is its leader's strongest Pokémon measured in the game on
#   Normal at that point; its own level cap (a badge table) isn't the Run's.
# - Badges are given in the order they're won (its gyms can be shuffled), so
#   cap stages and badge counts go by that order.
# - Rare Candy can't be used at all, so the cap needs no Rare Candy path.
# - Set mode is its own BATTLE STYLE option (Hard forces Set).

schema = 1
id = "rowe-2.1.9.1"
name = "Pokémon R.O.W.E. 2.1.9.1"
game_code = "BPEE"
family = "RSE"
sha1 = "81bd0f4bfa1c04ab2c6faab1bddd10e8a390ea77"
status = "supported"

[symbols]
party = 0x02025128
party_count = 0x02025125
enemy_party = 0x020252F0              # gEnemyParty, right after the Player's
pc_storage = { pointer = 0x03004B04 }
save_block_1 = { pointer = 0x03004AFC }
save_block_2 = { pointer = 0x03004B00 }
region_map_section = 0x02037C08        # gMapHeader.regionMapSectionId
main_callback2 = 0x03002B94            # gMain.callback2
overworld_callback = 0x080C3EF0        # CB2_Overworld
in_battle = { at = 0x03002FC9, mask = 0x02 }   # gMain.inBattle
battle_type_flags = 0x02024B6C
battle_mons = 0x02024C10
battler_party_indexes = 0x02024BFA
battler_statuses3 = 0x02024E64
disable_structs = 0x02024E74
script_context_status = 0x0203F6B4     # 0 running, 1 waiting, 2 idle
script_context = 0x0203F6B8
species_info = 0x08502C54
species_names = 0x084180A4
evolution_table = 0x085B6F60            # gEvolutionTable
items = 0x08F76D78
trainers = 0x08407220                   # gTrainers
type_names = 0x08422A7C
message_buffer = 0x02021ECC             # gStringVar4
# sCurrentMapMusic, sMapMusicState and gMPlayInfo_BGM, found from RAM at
# the first free moment (song 0x178, from its song table at 0x09157A10;
# the only match in RAM) and checked by rowe_acceptance.
map_music = { song = 0x03000ECC, state = 0x03000ED0, bgm_player = 0x03006240 }

[layout]
party_slot_size = 0x4C
box_slot_size = 0x34
encrypted = false
species_mask = 0x0FFF                   # species:12, then the form
plain = { species = 0x1C, met_location = 0x2A }
ot_id = 0x04
nickname = 0x08
nickname_length = 12
flags = 0x27
egg_mask = 0x80
has_species_mask = 0x00                 # a slot holds a Pokémon when its species isn't 0
checksum = 0x00                         # none
substructures = 0x00                    # none
level = 0x3C
hp = 0x3E
max_hp = 0x40
battle_mon_size = 0x60
battle_mon_hp = 0x2A
battle_type_trainer = 0x08
# BATTLE_TYPE_FIRST_BATTLE and _WALLY_TUTORIAL, as in Emerald.
battle_type_uncatchable = 0x210
battle_type_double = 0x01
perish_song_status3 = 0x20
disable_struct_size = 0x28
perish_timer = 0x22                     # perishSongTimer:4 beside its start value
script_context_stack_depth = 0x00
script_context_stack = 0x0C
script_context_pointer = 0x08
species_info_size = 0x40
species_name_length = 13
species_count = 1883
evolutions_per_species = 10
evolution_size = 8
evolution_target = 4
primary_type = 0x0C
item_size = 0x38
item_count = 941
item_pocket = 0x22
item_battle_usage = 0x28
ball_pocket = 3
pc_boxes = 14
pc_box_slots = 30
pc_boxes_offset = 4
trainer_id = 0x0A                      # in save block 2
play_time = 0x0E                       # in save block 2: hours, minutes, seconds, frames
badge_flags = 0xE24                    # the first badge won, whichever gym gives it
event_flags = 0x1754                   # in save block 1
# Its trainers: party size at +0, flags at +0x28, the party at +0x2C, 0x28
# bytes a member with no level (each stage gives its default).
trainer_size = 0x40
trainer_party_flags = 0x28
trainer_party_size = 0x00
trainer_party = 0x2C
trainer_mon_level = 0x00
trainer_mon_sizes = [0x28, 0x28, 0x28, 0x28]
type_name_length = 11
balls_pocket = 0x6D8                   # in save block 1
balls_pocket_slots = 16
dead_box = 14

[options.battle_style]
name = "BATTLE STYLE"
menu = "OPTIONS > BATTLE STYLE"
save_block = 2
offset = 0x15
mask = 0x04                            # bit 10 of the options halfword
values = { shift = 0x00, set = 0x04 }
watched = true

# Its randomizer modes that draw from the live RNG: flags 0x3C and 0x30.
[options.true_random]
name = "TRUE RANDOM"
menu = "New game > Randomizer > True Random"
save_block = 1
offset = 0x175B                        # flag 0x3C
mask = 0x10
values = { off = 0x00, on = 0x10 }
watched = true

[options.party_randomized]
name = "PARTY RANDOMIZED"
menu = "New game > Randomizer > Party Randomized"
save_block = 1
offset = 0x175A                        # flag 0x30
mask = 0x01
values = { off = 0x00, on = 0x01 }
watched = true

# Its randomizer is seeded by var 0x405B and the trainer ID's second byte, but
# part of its trainer randomizer draws from Random(); so the RNG is pinned
# from a trainer battle's trigger until the enemy party is made.
[own_randomizer]
seed_var = { var = 0x405B, vars = 0x1BCA }
trainer_id_byte = 1
rng_pin = { rng = 0x03004AF0, opponent = 0x02039B32 }   # gRngValue, gTrainerBattleOpponent_A
keep = [{ option = "true_random", value = "off" }, { option = "party_randomized", value = "off" }]

# Closes an Area: the ball is refused with "The box is full."
[rules.catch_block]
method = "patch"
sites = [{ at = 0x0809C244, expect = "10 B5 00 24", write = "01 20 70 47" }]  # IsPlayerPartyAndPokemonStorageFull -> TRUE

# Its level-100 checks after `movs r1, #0x38` (MON_DATA_LEVEL); the first is in getexp.
[rules.level_cap]
method = "patch"
sites = [
  { at = 0x08061CE4, expect = "64 28" },
  { at = 0x0806216A, expect = "64 28" },
  { at = 0x0809CB58, expect = "64 28" },
  { at = 0x0821C1C6, expect = "64 28" },
]

# Only Poké Balls keep a battle use: in its own Bag, that bans items in every battle.
[rules.no_items_trainer]
method = "zero_table_field"

[rules.no_items_wild]
method = "zero_table_field"

[rules.set_mode]
method = "native"
option = "battle_style"
value = "set"

# "Give a nickname?" is answered Yes, as in Emerald.
[rules.must_nickname]
method = "key_filter"
battle_script_pointer = 0x02024DC0   # gBattlescriptCurrInstr
command_table = 0x0842CC50           # gBattleScriptingCommandsTable
command = 0x08074709                 # Cmd_trygivecaughtmonnick
battle_communication = 0x02024F2A
field_yes_no = [0x082F6957]          # Std_MsgboxYesNo, after its yesnobox
question = "give a nickname"

