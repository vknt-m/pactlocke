# Pokémon LeafGreen (USA) 1.0, laid out like FireRed: its RAM is FireRed's,
# and only ROM addresses move. Each one here is FireRed's, moved to the same
# pret pokeleafgreen symbol (plus offset), and its bytes checked in a clean dump.

schema = 1
id = "leafgreen-usa-1.0"
name = "Pokémon LeafGreen (USA) 1.0"
game_code = "BPGE"
sha1 = "574fa542ffebb14be69902d1d36f1ec0a4afd71e"
status = "supported"
parent = "firered-usa-1.0"

[symbols]
species_info = 0x08254760
species_names = 0x08245EBC              # gSpeciesNames
evolution_table = 0x08259734            # gEvolutionTable
items = 0x083DAE64
trainers = 0x0823EAA4                   # gTrainers
type_names = 0x0824F17C                 # gTypeNames

# As FireRed's, with the ball's "BOX is full" lines pointed at Oak's: the
# Bag's, and the Safari Zone's BALL (battle string 0x530/4), which gets a copy
# without the {PLAYER} placeholder battle text can't show, in free ROM.
[rules.catch_block]
method = "patch"
sites = [
  { at = 0x08040F6C, expect = "10 B5 00 24", write = "01 20 70 47" },  # IsPlayerPartyAndPokemonStorageFull -> TRUE
  { at = 0x080A1E30, expect = "6D 64 41 08", write = "61 62 41 08" },  # gText_BoxFull -> gText_OakForbidsUseOfItemHere
  { at = 0x08F00800, expect = "FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF", write = "C9 BB C5 F0 00 CE DC DD E7 00 DD E7 E2 B4 E8 00 E8 DC D9 00 E8 DD E1 D9 FE E8 E3 00 E9 E7 D9 00 E8 DC D5 E8 AB FB FF" },  # "OAK: This isn't the time / to use that!"
  { at = 0x083FE2A8, expect = "B2 D6 3F 08", write = "00 08 F0 08" },  # the Safari BALL's line -> that copy
]

[rules.must_nickname]
method = "key_filter"
battle_script_pointer = 0x02023D74   # gBattlescriptCurrInstr
command_table = 0x082500F8           # gBattleScriptingCommandsTable
command = 0x0802DD39                 # Cmd_trygivecaughtmonnick
battle_communication = 0x02023E82
field_yes_no = [0x081A4E41]          # Std_MsgboxYesNo, after its yesnobox
question = "give a nickname"

