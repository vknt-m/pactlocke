# Sync Gates: the leaders whose battle is a plain `trainerbattle` with their
# trainer id. Mirskle's is the verified instruction (the scan's
# second match; the first, at 0x087413D5, is a type-8 variant that never
# starts a battle). The others are checked in this ROM's bytes only. Mel,
# Tessy, Benjamin, the Elite Four and the Champion start their battles from
# a script variable through CFRU's own code, and aren't gates yet.
[sync_gates]
hold = 0x09FF0000

[[sync_gates.gates]]
name = "Mirskle"
sites = [{ at = 0x0874148F, expect = "5C 01 06 00 00" }]

[[sync_gates.gates]]
name = "Véga"
sites = [
    { at = 0x08741818, expect = "5C 01 9F 01 00" },
    { at = 0x087650E5, expect = "5C 01 9F 01 00" },
]

[[sync_gates.gates]]
name = "Alice"
sites = [{ at = 0x0878E827, expect = "5C 03 14 00 00" }]

[[sync_gates.gates]]
name = "Galavan"
sites = [{ at = 0x08771C3D, expect = "5C 03 A2 01 00" }]

[[sync_gates.gates]]
name = "Big Mo"
sites = [
    { at = 0x087FD96D, expect = "5C 01 A3 01 00" },
    { at = 0x087FD980, expect = "5C 01 A3 01 00" },
]

