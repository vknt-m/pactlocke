[options.battle_style]
name = "Battle style"
menu = "OPTIONS > BATTLE STYLE"
save_block = 2
offset = 0x15
mask = 0x02
values = { shift = 0x00, set = 0x02 }

# Closes an Area: the ball is refused in the Bag with the game's own "This
# isn't the time to use that!" line. The Safari Zone's BALL still shows
# FireRed's "box is full" line: its battle string isn't found in CFRU yet.
[rules.catch_block]
method = "patch"
sites = [
  { at = 0x08040F6C, expect = "10 B5 00 24", write = "01 20 70 47" },  # IsPlayerPartyAndPokemonStorageFull -> TRUE
  { at = 0x080A1E5C, expect = "31 66 41 08", write = "25 64 41 08" },  # gText_BoxFull -> "This isn't the time to use that!"
]

# CFRU checks `level >= MAX_LEVEL` as `cmp rX, #99`, written one below the
# cap: three sites in its Cmd_getexp (battle command 0x23) and one in its
# EXP update. FireRed's two item-use checks (Rare Candy) keep `cmp #100`.
[rules.level_cap]
method = "patch"
sites = [
  { at = 0x089E1DFC, expect = "63 2B", below_cap = 1 },  # Cmd_getexp
  { at = 0x089E2274, expect = "63 2A", below_cap = 1 },  # Cmd_getexp
  { at = 0x089E2664, expect = "63 2B", below_cap = 1 },  # Cmd_getexp
  { at = 0x089E19AC, expect = "63 2B", below_cap = 1 },  # the EXP update handler
  { at = 0x08041834, expect = "64 28" },                 # PokemonUseItemEffects (Rare Candy)
  { at = 0x0804274E, expect = "64 28" },                 # PokemonItemUseNoEffect
]

# CFRU's hook for FireRed's Bag check calls its IsBagDisabled() and branches
# past "Items can't be used now." when it's false: the branch becomes a nop.
[rules.no_items_trainer]
method = "patch"
sites = [{ at = 0x089A24E6, expect = "01 D0", write = "C0 46" }]

# Only Poké Balls keep a battle use in wild battles, in CFRU's item table.
[rules.no_items_wild]
method = "zero_table_field"

[rules.set_mode]
method = "option_bit"
option = "battle_style"
value = "set"

# FireRed's trygivecaughtmonnick is still command 0xF3 in CFRU's own table,
# and FireRed's shared MSGBOX_YESNO script is unchanged.
[rules.must_nickname]
method = "key_filter"
battle_script_pointer = 0x02023D74   # gBattlescriptCurrInstr
command_table = 0x0899FFFC           # CFRU's gBattleScriptingCommandsTable
command = 0x0802DD39                 # Cmd_trygivecaughtmonnick
battle_communication = 0x02023E82
field_yes_no = [0x081A4E65]
question = "give a nickname"

# Level cap stages: the eight gym leaders, by the main game's trainer ids
# (the 7xx and 72 to 88 teams are other difficulties and rematches). Not yet
# listed: the Elite Four (410 to 413) and the Champion, whose defeat flags
# haven't been found.
[[level_caps]]
name = "Mirskle"
trainers = [6]
badges = 1

[[level_caps]]
