item_size = 44
item_count = 729                       # Hisui Rock is the last item
item_pocket = 26
item_battle_usage = 32
ball_pocket = 3
pc_boxes = 25
pc_box_slots = 30
pc_boxes_offset = 4
trainer_id = 0x0A                      # in save block 2
play_time = 0x0E                       # in save block 2
badge_flags = 0x820                    # FLAG_BADGE01_GET: set after Mirskle's battle
event_flags = 0xEE0                    # in save block 1
trainer_size = 40
trainer_party_flags = 0
trainer_party_size = 32
trainer_party = 36
trainer_mon_level = 2
trainer_mon_sizes = [8, 16, 8, 16]
