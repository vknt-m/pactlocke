# Closes an Area: the ball is refused in the Bag with Oak's "This isn't the
# time to use that!" line. Radical Red's own FLAG_NO_CATCHING (0x902) does it
# too, with "The Pokémon can't be caught!", but the patch keeps one line for
# every FireRed game. The Safari Zone's BALL still shows FireRed's "box is
# full" line: its battle string isn't found in CFRU yet.
[rules.catch_block]
method = "patch"
sites = [
  { at = 0x08040F6C, expect = "10 B5 00 24", write = "01 20 70 47" },  # IsPlayerPartyAndPokemonStorageFull -> TRUE
  { at = 0x080A1E5C, expect = "31 66 41 08", write = "25 64 41 08" },  # gText_BoxFull -> "This isn't the time to use that!"
]

# CFRU checks `level >= MAX_LEVEL` as `cmp rX, #99`, written one below the
# cap: three sites in its Cmd_getexp (battle command 0x23) and one in its
# EXP update. Radical Red changed FireRed's two item-use checks (Rare Candy)
# to `cmp #250`; the cap is written there as it is.
[rules.level_cap]
method = "patch"
sites = [
  { at = 0x0909489C, expect = "63 2B", below_cap = 1 },  # Cmd_getexp
  { at = 0x09094CC8, expect = "63 2A", below_cap = 1 },  # Cmd_getexp
  { at = 0x0909503E, expect = "63 2B", below_cap = 1 },  # Cmd_getexp
  { at = 0x09094490, expect = "63 2B", below_cap = 1 },  # the EXP update handler
  { at = 0x08041834, expect = "FA 28" },                 # PokemonUseItemEffects (Rare Candy)
  { at = 0x0804274E, expect = "FA 28" },                 # PokemonItemUseNoEffect
]

# CFRU's hook for FireRed's Bag check calls its IsBagDisabled() and branches
# past "Items can't be used now." when it's false: the branch becomes a nop.
# Radical Red's own FLAG_DISABLE_BAG (0x915) does the same.
[rules.no_items_trainer]
method = "patch"
sites = [{ at = 0x0904230A, expect = "01 D0", write = "C0 46" }]

# Only Poké Balls keep a battle use in wild battles, in CFRU's item table.
[rules.no_items_wild]
method = "zero_table_field"

# Radical Red never offers to switch after a foe faints.
[rules.set_mode]
method = "always"

# FireRed's trygivecaughtmonnick is still command 0xF3 in CFRU's own table,
# and FireRed's shared MSGBOX_YESNO script is unchanged.
[rules.must_nickname]
method = "key_filter"
battle_script_pointer = 0x02023D74   # gBattlescriptCurrInstr
command_table = 0x0903EF20           # CFRU's gBattleScriptingCommandsTable
command = 0x0802DD39                 # Cmd_trygivecaughtmonnick
battle_communication = 0x02023E82
field_yes_no = [0x081A4E65]
question = "give a nickname"

