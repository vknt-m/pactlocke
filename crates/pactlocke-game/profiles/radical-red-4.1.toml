# Pokémon Radical Red 4.1 by soupercell, a FireRed (USA) 1.0 hack on CFRU
# (the Complete Fire Red Upgrade). It keeps FireRed's RAM, save block
# pointers, event flags, trainer table, map names and scripts (with copies
# of its own), but CFRU replaces the battle engine, EXP and Bag code and
# keeps Pokémon unencrypted, in a fixed order. Its PC is CFRU's: 25 boxes of
# 58-byte compressed slots, spread over RAM (CFRU's sPokemonBoxPtrs, at
# 0x09148930 in this ROM). It always plays the Set battle style. Its tables
# were found by reading FireRed's literal pools in this ROM, and its patch
# sites by `cargo dev scan`.

schema = 1
id = "radical-red-4.1"
name = "Pokémon Radical Red 4.1"
game_code = "BPRE"
family = "FRLG"
sha1 = "964f951a0fdaf209e4ea1344883ef0d557bb3a80"
status = "supported"

[symbols]
party = 0x02024284
party_count = 0x02024029
enemy_party = 0x0202402C              # gEnemyParty
# FireRed's PC pointer; CFRU reads its boxes from pc_box_starts instead.
pc_storage = { pointer = 0x03005010 }
save_block_1 = { pointer = 0x03005008 }
save_block_2 = { pointer = 0x0300500C }
region_map_section = 0x02036E10        # gMapHeader.regionMapSectionId
main_callback2 = 0x030030F4            # gMain.callback2
overworld_callback = 0x080565B4        # CB2_Overworld
in_battle = { at = 0x03003529, mask = 0x02 }   # gMain.inBattle
battle_type_flags = 0x02022B4C
battle_mons = 0x02023BE4
battler_party_indexes = 0x02023BCE
battler_statuses3 = 0x02023DFC
disable_structs = 0x02023E0C
script_context_status = 0x03000EA8     # 0 running, 1 waiting, 2 idle
script_context = 0x03000EB0
species_info = 0x097B98EC              # CFRU's gBaseStats
species_names = 0x094042CC             # gSpeciesNames
evolution_table = 0x097CD9B0           # gEvolutionTable
items = 0x093C0000                     # CFRU's item table
trainers = 0x0823EAC8                  # gTrainers, where FireRed has it
type_names = 0x0910140C                # gTypeNames, with Fairy
message_buffer = 0x02021D18            # gStringVar4
# Radical Red keeps the Bag in RAM, outside save block 1 (gBagPockets[2] points here).
balls_pocket = 0x0203C354
# CFRU's boxes: 1 to 19 one after another, 20 to 22, 23 and 24, then 25 in save block 2.
pc_box_starts = [
  0x02029318, 0x020299E4, 0x0202A0B0, 0x0202A77C, 0x0202AE48, 0x0202B514, 0x0202BBE0,
  0x0202C2AC, 0x0202C978, 0x0202D044, 0x0202D710, 0x0202DDDC, 0x0202E4A8, 0x0202EB74,
  0x0202F240, 0x0202F90C, 0x0202FFD8, 0x020306A4, 0x02030D70, 0x0203CB44, 0x0203D210,
  0x0203D8DC, 0x02027434, 0x02027B00, 0x02024638,
]

