# Pokémon Sapphire (USA) 1.0, laid out like Ruby: its RAM is Ruby's, and only
# ROM addresses move. Each one here is pret's pokesapphire symbol, its bytes
# checked in a clean dump.

schema = 1
id = "sapphire-usa-1.0"
name = "Pokémon Sapphire (USA) 1.0"
game_code = "AXPE"
sha1 = "3ccbbd45f8553c36463f13b938e833f652b793e4"
status = "supported"
parent = "ruby-usa-1.0"

[symbols]
overworld_callback = 0x080543A8        # CB2_Overworld
species_info = 0x081FEBA8
species_names = 0x081F70FC              # gSpeciesNames
evolution_table = 0x08203AF8            # gEvolutionTable
items = 0x083C55BC
trainers = 0x081F048C                   # gTrainers
type_names = 0x081F9800                 # gTypeNames

# As Ruby's, at Sapphire's addresses.
[rules.catch_block]
method = "patch"
sites = [
  { at = 0x0803DD20, expect = "10 B5 00 24", write = "01 20 70 47" },  # PlayerPartyAndPokemonStorageFull -> TRUE
  { at = 0x080CA28C, expect = "50 EB 40 08", write = "46 E9 40 08" },  # gOtherText_BoxIsFull -> gOtherText_DadsAdvice
  { at = 0x08F00800, expect = "FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF", write = "BE BB BE B4 E7 00 D5 D8 EA DD D7 D9 AD AD AD FE CE DC D9 E6 D9 B4 E7 00 D5 00 E8 DD E1 D9 00 D5 E2 D8 00 E4 E0 D5 D7 D9 00 DA E3 E6 FA D9 EA D9 E6 ED E8 DC DD E2 DB AB FB FF" },  # "DAD's advice... / There's a time and place for / everything!"
  { at = 0x08401514, expect = "A4 0A 40 08", write = "00 08 F0 08" },  # the Safari BALL's line -> that copy
]

[rules.level_cap]
method = "patch"
sites = [
  { at = 0x080202B4, expect = "64 28" },  # atk23_getexp
  { at = 0x0802059C, expect = "64 28" },  # atk23_getexp
  { at = 0x0803E5F8, expect = "64 28" },  # PokemonUseItemEffects (Rare Candy)
  { at = 0x080706AC, expect = "64 28" },  # DoRareCandyItemEffect
]

[rules.must_nickname]
method = "key_filter"
battle_script_pointer = 0x02024C10   # gBattlescriptCurrInstr
command_table = 0x081FA6CC           # gBattleScriptingCommandsTable
command = 0x0802BC91                 # atkF3_trygivecaughtmonnick
battle_communication = 0x02024D1E
field_yes_no = [0x0819F794]          # Std_MsgboxYesNo, after its yesnobox
question = "give a nickname"

[areas]
0x42 = "Aqua Hideout"

