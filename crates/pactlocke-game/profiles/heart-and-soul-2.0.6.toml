menu = "OPTION > BATTLE STYLE"
save_block = 2
offset = 0x15
mask = 0x02
values = { shift = 0x00, set = 0x02 }
watched = true

# Its challenge settings (save block 3 +0x10 on), changeable from the PC.
[options.player_items]
name = "PLAYER ITEMS"
menu = "DIFFICULTY > PLAYER ITEMS"
save_block = 3
offset = 0x17
mask = 0x20
values = { allowed = 0x00, banned = 0x20 }
watched = true

[options.level_cap]
name = "LEVEL CAP"
menu = "DIFFICULTY > LEVEL CAP"
save_block = 3
offset = 0x18
mask = 0x60
values = { off = 0x00, normal = 0x20, hard = 0x40 }
watched = true

[options.nuzlocke]
name = "NUZLOCKE"
menu = "NUZLOCKE > NUZLOCKE"
save_block = 3
offset = 0x16
mask = 0x04
values = { off = 0x00, on = 0x04 }
watched = true

[options.fainting]
name = "FAINTING"
menu = "NUZLOCKE > FAINTING"
save_block = 3
offset = 0x1B
mask = 0x20
values = { cemetery = 0x00, release = 0x20 }
watched = true

[options.nicknaming]
name = "NICKNAMING"
menu = "NUZLOCKE > NICKNAMING"
save_block = 3
offset = 0x1B
mask = 0x10
values = { off = 0x00, on = 0x10 }
watched = true

[options.chaos]
name = "CHAOS"
menu = "RANDOMIZER > CHAOS"
save_block = 3
offset = 0x14
mask = 0x01
values = { off = 0x00, on = 0x01 }
watched = true

# Its randomizer is a stateless draw seeded by the trainer ID, except where a
# caller passes Random32() as the per-call seed: scripted Gifts and Statics,
# and wild Pokémon when not map-based. Those seven `bl Random32` become
# `movs r0, #0; nop`. CHAOS re-seeds everything from the live RNG, so it stays off.
[own_randomizer]
seed_is_trainer_id = true
sites = [
  { at = 0x081C5B72, expect = "29 F0 85 FA", write = "00 20 C0 46" },  # CreateScriptedWildMon
  { at = 0x0820A9D6, expect = "E4 F7 53 FB", write = "00 20 C0 46" },  # CreateShinyScriptedMon
  { at = 0x0820AAD6, expect = "E4 F7 D3 FA", write = "00 20 C0 46" },  # ScriptGiveMon
  { at = 0x0820B29E, expect = "E3 F7 EF FE", write = "00 20 C0 46" },  # ScriptGiveMon
  { at = 0x0820B2F4, expect = "E3 F7 C4 FE", write = "00 20 C0 46" },  # ScrCmd_createmon
  { at = 0x0820B862, expect = "E3 F7 0D FC", write = "00 20 C0 46" },  # another scripted Pokémon
  { at = 0x081F0780, expect = "FE F7 7E FC", write = "00 20 C0 46" },  # RandomizeWildEncounter, not map-based
]
keep = [{ option = "chaos", value = "off" }]

# Catches are refused by its own FLAG_NO_WILD_CATCHING: "POKé BALLS cannot be used right now!"
[rules.catch_block]
method = "set_flag"
flag = 0x96B

# GetCurrentLevelCap -> `movs r0, #cap; bx lr`. Its callers apply it only with LEVEL CAP on.
[rules.level_cap]
method = "patch"
sites = [{ at = 0x080EE288, expect = "1D 4B 1B 68", write = "00 20 70 47" }]

# PLAYER ITEMS banned: "Battle items are not allowed under current rules!", balls still thrown.
[rules.no_items_trainer]
method = "native"
option = "player_items"
value = "banned"

[rules.no_items_wild]
method = "native"
option = "player_items"
value = "banned"

[rules.set_mode]
method = "native"
option = "battle_style"
value = "set"

# "Would you like to give X a nickname?" is answered Yes: command 0xD5.
[rules.must_nickname]
method = "key_filter"
battle_script_pointer = 0x02000128   # gBattlescriptCurrInstr
command_table = 0x084816F8           # gBattleScriptingCommandsTable
command = 0x080AE169                 # Cmd_trygivecaughtmonnick
battle_communication = 0x020001BC
field_yes_no = [0x08330441]          # Std_MsgboxYesNo, after its yesnobox
question = "give a nickname"

[[rule_options]]
rule = "level_cap"
option = "level_cap"
value = "normal"
pactlocke_too = true

# Its Nuzlocke mode, with first Encounter and faint = Dead both on: its
# cemetery takes the Player's own fainted Pokémon, and its NICKNAMING asks
# for a name at once. Pactlocke keeps every rule itself as well.
[[rule_options]]
rule = "faint_is_dead"
option = "nuzlocke"
value = "on"
with = ["first_encounter"]
pactlocke_too = true

[[rule_options]]
rule = "faint_is_dead"
option = "fainting"
value = "cemetery"
with = ["first_encounter"]
pactlocke_too = true

[[rule_options]]
rule = "must_nickname"
option = "nicknaming"
value = "on"
with = ["first_encounter", "faint_is_dead"]
pactlocke_too = true

