# Pokémon Heart and Soul 2.0.6 by the HnS Development team, built on
# pokeemerald-expansion 1.15 (its source is public: tag `Release-v2.0.6` of
# PokemonHnS-Development/pokehns-expansion). Its RAM, tables and scripts are
# expansion's, read from this ROM and its RAM:
# - Pokémon are encrypted as in Emerald, but the species is the low 11 bits
#   beside the tera type; each battler keeps Perish Song in its own volatiles
#   (0x88-byte battlers); species info is 0x10C bytes with the name at +0x2C
#   and a pointer to its evolutions at +0xA4; trainers are 0x34 bytes with
#   0x24-byte party entries; type names aren't kept as text.
# - Its challenge settings live in save block 3 and can be changed from the PC
#   at any time, so each one Pactlocke uses is watched.
# - No items and set mode are its own options; a catch is refused by its own
#   FLAG_NO_WILD_CATCHING; the cap stubs its GetCurrentLevelCap, whose callers
#   (EXP, Rare Candy, the Day Care) apply a cap only with its LEVEL CAP option on.
# - Its Nuzlocke mode (with FAINTING on cemetery and forced nicknames) is used
#   only when the Ruleset has both first Encounter and faint = Dead.
# Its scripts keep the original command numbers for what the hold script uses.

schema = 1
id = "heart-and-soul-2.0.6"
name = "Pokémon Heart and Soul 2.0.6"
game_code = "BPEE"
family = "RSE"
sha1 = "79ee6df0869c1773c8c6a5f764afc1f8d833d8bb"
status = "supported"
type_name_list = [
  "None", "Normal", "Fighting", "Flying", "Poison", "Ground", "Rock", "Bug", "Ghost", "Steel", "Mystery",
  "Fire", "Water", "Grass", "Electric", "Psychic", "Ice", "Dragon", "Dark", "Fairy", "Stellar",
]

[symbols]
party = 0x02034764
party_count = 0x020342A4
enemy_party = 0x020342B4              # gEnemyParty, 1200 bytes before the Player's
pc_storage = { pointer = 0x030041DC }
save_block_1 = { pointer = 0x030041D8 }
save_block_2 = { pointer = 0x030041D4 }
save_block_3 = { pointer = 0x03000178 }
region_map_section = 0x02001D20        # gMapHeader.regionMapSectionId
main_callback2 = 0x03005BDC            # gMain.callback2
overworld_callback = 0x0819A010        # CB2_Overworld
in_battle = { at = 0x03006011, mask = 0x02 }   # gMain.inBattle
battle_type_flags = 0x020000AC
battle_mons = 0x02000420
battler_party_indexes = 0x02000144
battler_statuses3 = 0x0200047C         # gBattleMons[0].volatiles, Perish Song's word
disable_structs = 0x02000420           # each battler's own volatiles hold the Perish count
script_context_status = 0x03001FDC     # 0 running, 1 waiting, 2 idle
script_context = 0x03001FE0
species_info = 0x087E6544
species_names = 0x087E6570              # gSpeciesInfo[0].speciesName
evolution_table = 0x087E6544            # unused: each species points at its own
items = 0x0878EFC0
trainers = 0x084C9C8C                   # gTrainers
message_buffer = 0x0203B8D4             # gStringVar4

[layout]
party_slot_size = 100
box_slot_size = 80
encrypted = true
species_mask = 0x07FF                   # species:11, then the tera type
ot_id = 0x04
nickname = 0x08
nickname_length = 10
flags = 0x13
egg_mask = 0x04
has_species_mask = 0x02
checksum = 0x1C
substructures = 0x20
level = 0x54
hp = 0x56
max_hp = 0x58
battle_mon_size = 0x88
battle_mon_hp = 0x2A
battle_type_trainer = 0x08
# BATTLE_TYPE_FIRST_BATTLE and _CATCH_TUTORIAL, as in Emerald.
battle_type_uncatchable = 0x210
battle_type_double = 0x01
perish_song_status3 = 0x80              # volatiles.perishSong
battler_status_stride = 0x88
disable_struct_size = 0x88
perish_timer = 0x6E                     # volatiles.perishSongTimer, two bits
perish_timer_mask = 0x0C
script_context_stack_depth = 0x00
script_context_stack = 0x0C
script_context_pointer = 0x08
species_info_size = 0x10C
species_name_length = 0x10C             # read up to its terminator inside the species info
species_count = 1573                    # NUM_SPECIES, from the ROM's expansion header
evolutions_per_species = 32
evolutions_pointer = 0xA4               # gSpeciesInfo[].evolutions, ended by 0xFFFF
evolution_size = 12                     # struct Evolution: method, param, target, conditions
evolution_target = 4
primary_type = 6
item_size = 0x2C                        # struct ItemInfo
item_count = 901
item_pocket = 0x1E                      # importance:2, notConsumed:1, pocket:5
item_battle_usage = 0x21
ball_pocket = 0x10
pc_boxes = 14
pc_box_slots = 30
pc_boxes_offset = 4
trainer_id = 0x0A                      # in save block 2
play_time = 0x0E                       # in save block 2: hours, minutes, seconds, frames
badge_flags = 0x880                    # FLAG_BADGE01_GET: Johto's eight
event_flags = 0x198C                   # in save block 1
trainer_size = 0x34
trainer_party_flags = 0x2B             # every party entry is the same size
trainer_party_size = 0x2B
trainer_party = 0x08
trainer_mon_level = 0x1A
trainer_mon_sizes = [0x24, 0x24, 0x24, 0x24]
type_name_length = 0
balls_pocket = 0xA04                   # in save block 1
balls_pocket_slots = 16
dead_box = 14

