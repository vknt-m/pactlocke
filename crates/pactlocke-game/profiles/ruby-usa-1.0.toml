# Pokémon Ruby (USA) 1.0. Addresses are pret's pokeruby symbols, and every
# patch site's expected bytes were read from a clean dump. Laid out like
# Emerald, but its save blocks and PC stay put, and the party is in IWRAM. The
# rule methods are FireRed's, checked on Ruby and Sapphire. Its clock is
# the fake-epoch real-time clock every Run's core keeps.

schema = 1
id = "ruby-usa-1.0"
name = "Pokémon Ruby (USA) 1.0"
game_code = "AXVE"
family = "RSE"
sha1 = "f28b6ffc97847e94a6c21a63cacf633ee5c8df1e"
status = "supported"

[symbols]
party = 0x03004360
party_count = 0x03004350
enemy_party = 0x030045C0              # gEnemyParty
pc_storage = { at = 0x020300A0 }
save_block_1 = { at = 0x02025734 }
save_block_2 = { at = 0x02024EA4 }
region_map_section = 0x0202E83C        # gMapHeader.regionMapSectionId
main_callback2 = 0x03001774            # gMain.callback2
overworld_callback = 0x080543A4        # CB2_Overworld
in_battle = { at = 0x03001BAD, mask = 0x02 }   # gMain.inBattle (Ruby's gMain is 4 bytes longer)
battle_type_flags = 0x020239F8
battle_mons = 0x02024A80
battler_party_indexes = 0x02024A6A
battler_statuses3 = 0x02024C98
disable_structs = 0x02024CA8
script_context_status = 0x030005B0     # 0 running, 1 waiting, 2 idle
script_context = 0x030005B8
species_info = 0x081FEC18
species_names = 0x081F716C              # gSpeciesNames
evolution_table = 0x08203B68            # gEvolutionTable
items = 0x083C5564
trainers = 0x081F04FC                   # gTrainers
type_names = 0x081F9870                 # gTypeNames
message_buffer = 0x020234CC             # gStringVar4

[layout]
# How a Pokémon is stored (pret's struct Pokemon / BoxPokemon), as in FireRed.
party_slot_size = 100
box_slot_size = 80
encrypted = true
ot_id = 0x04
nickname = 0x08
nickname_length = 10
flags = 0x13
egg_mask = 0x04
has_species_mask = 0x02
checksum = 0x1C
substructures = 0x20
level = 0x54
hp = 0x56
max_hp = 0x58
battle_mon_size = 0x58
battle_mon_hp = 0x28
battle_type_trainer = 0x08
# BATTLE_TYPE_FIRST_BATTLE and _WALLY_TUTORIAL: Birch's Poochyena, fought
# before the Player has a ball, and Wally's catching demo.
battle_type_uncatchable = 0x210
battle_type_double = 0x01
perish_song_status3 = 0x20
disable_struct_size = 0x1C
perish_timer = 0x0F
script_context_stack_depth = 0x00
script_context_stack = 0x0C
script_context_pointer = 0x08
species_info_size = 28
species_name_length = 11
species_count = 412                     # NUM_SPECIES
evolutions_per_species = 5              # EVOS_PER_MON
evolution_size = 8                      # struct Evolution
evolution_target = 4
primary_type = 6
item_size = 44
item_count = 349
item_pocket = 26
item_battle_usage = 32
ball_pocket = 2                         # POCKET_POKE_BALLS
pc_boxes = 14
pc_box_slots = 30
pc_boxes_offset = 4
trainer_id = 0x0A                      # in save block 2
play_time = 0x0E                       # in save block 2: hours, minutes, seconds, frames
badge_flags = 0x807                    # FLAG_BADGE01_GET: eight flags, one per badge
event_flags = 0x1220                   # in save block 1
trainer_size = 40
trainer_party_flags = 0
trainer_party_size = 32
trainer_party = 36
trainer_mon_level = 2
trainer_mon_sizes = [8, 16, 8, 16]
type_name_length = 7
balls_pocket = 0x600                   # in save block 1: bagPocket_PokeBalls
balls_pocket_slots = 16
dead_box = 14

[options.battle_style]
name = "Battle style"
menu = "OPTION > BATTLE STYLE"
save_block = 2
offset = 0x15
mask = 0x02
values = { shift = 0x00, set = 0x02 }

# Closes an Area: the ball is refused, and kept, with Dad's "time and place"
# line: the Bag's, and the Safari Zone's BALL (battle string 0x530/4), which
# gets a copy without the {PLAYER} placeholder battle text can't show, in
# free ROM.
[rules.catch_block]
method = "patch"
sites = [
  { at = 0x0803DD20, expect = "10 B5 00 24", write = "01 20 70 47" },  # PlayerPartyAndPokemonStorageFull -> TRUE
  { at = 0x080CA28C, expect = "F4 EA 40 08", write = "EA E8 40 08" },  # gOtherText_BoxIsFull -> gOtherText_DadsAdvice
  { at = 0x08F00800, expect = "FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF", write = "BE BB BE B4 E7 00 D5 D8 EA DD D7 D9 AD AD AD FE CE DC D9 E6 D9 B4 E7 00 D5 00 E8 DD E1 D9 00 D5 E2 D8 00 E4 E0 D5 D7 D9 00 DA E3 E6 FA D9 EA D9 E6 ED E8 DC DD E2 DB AB FB FF" },  # "DAD's advice... / There's a time and place for / everything!"
  { at = 0x084014BC, expect = "4C 0A 40 08", write = "00 08 F0 08" },  # the Safari BALL's line -> that copy
]

# The level-100 checks after `movs r1, #0x38` (MON_DATA_LEVEL); the first byte
# is the cap. Not the Day Care's (TakeSelectedPokemonFromDaycare): it has only
# the soft cap.
[rules.level_cap]
method = "patch"
sites = [
  { at = 0x080202B4, expect = "64 28" },  # atk23_getexp
  { at = 0x0802059C, expect = "64 28" },  # atk23_getexp
  { at = 0x0803E5F8, expect = "64 28" },  # PokemonUseItemEffects (Rare Candy)
  { at = 0x080706A8, expect = "64 28" },  # DoRareCandyItemEffect
]

# BATTLE_TYPE_TRAINER added to the "items can't be used" mask in the action
# selection (pret's HandleTurnActionSelectionState).
[rules.no_items_trainer]
method = "patch"
sites = [{ at = 0x080126D4, expect = "02 09 00 00", write = "0A 09 00 00" }]

# Only Poké Balls keep a battle use in wild battles.
[rules.no_items_wild]
method = "zero_table_field"

[rules.set_mode]
method = "option_bit"
option = "battle_style"
value = "set"

# "Give a nickname?" is answered Yes, as in FireRed.
[rules.must_nickname]
method = "key_filter"
battle_script_pointer = 0x02024C10   # gBattlescriptCurrInstr
command_table = 0x081FA73C           # gBattleScriptingCommandsTable
command = 0x0802BC91                 # atkF3_trygivecaughtmonnick
battle_communication = 0x02024D1E
field_yes_no = [0x0819F804]          # Std_MsgboxYesNo, after its yesnobox
question = "give a nickname"

