# Pokémon Glazed 9.2.0 by Gamer2020, a binary hack of Emerald (USA, Europe).
# It keeps Emerald's RAM, save layout, Pokémon encryption, tables and patch
# sites (checked by `cargo dev scan`). Its Areas, Gifts, Statics and leaders are its own, read from this
# ROM. It puts its own data where Emerald's profile has free ROM, so the
# Safari line and the Sync Gates' hold scripts go past 0x09F00000.

schema = 1
id = "glazed-9.2.0"
name = "Pokémon Glazed 9.2.0"
game_code = "BPEE"
family = "RSE"
sha1 = "e10105d8544469c6a11ca2cf510289981df3c3b0"
status = "supported"

[symbols]
party = 0x020244EC
party_count = 0x020244E9
enemy_party = 0x02024744              # gEnemyParty
pc_storage = { pointer = 0x03005D94 }
save_block_1 = { pointer = 0x03005D8C }
save_block_2 = { pointer = 0x03005D90 }
region_map_section = 0x0203732C        # gMapHeader.regionMapSectionId
main_callback2 = 0x030022C4            # gMain.callback2
overworld_callback = 0x08085E5C        # CB2_Overworld
in_battle = { at = 0x030026F9, mask = 0x02 }   # gMain.inBattle
battle_type_flags = 0x02022FEC
battle_mons = 0x02024084
battler_party_indexes = 0x0202406E
battler_statuses3 = 0x020242AC
disable_structs = 0x020242BC
script_context_status = 0x03000E38     # 0 running, 1 waiting, 2 idle
script_context = 0x03000E40
species_info = 0x083203CC
species_names = 0x083185C8              # gSpeciesNames
evolution_table = 0x0832531C            # gEvolutionTable
items = 0x085839A0
trainers = 0x08310030                   # gTrainers
type_names = 0x0831AE38                 # gTypeNames
message_buffer = 0x02021FC4             # gStringVar4
# Emerald's sCurrentMapMusic, sMapMusicState and gMPlayInfo_BGM, checked on
# this ROM by glazed_acceptance.
map_music = { song = 0x03000F48, state = 0x03000F4C, bgm_player = 0x03007420 }

[layout]
# How a Pokémon is stored (pret's struct Pokemon / BoxPokemon), as in FireRed.
party_slot_size = 100
box_slot_size = 80
encrypted = true
ot_id = 0x04
nickname = 0x08
nickname_length = 10
flags = 0x13
egg_mask = 0x04
has_species_mask = 0x02
checksum = 0x1C
substructures = 0x20
level = 0x54
hp = 0x56
max_hp = 0x58
battle_mon_size = 0x58
battle_mon_hp = 0x28
battle_type_trainer = 0x08
# BATTLE_TYPE_FIRST_BATTLE and _WALLY_TUTORIAL: Birch's Poochyena, fought
# before the Player has a ball, and Wally's catching demo.
battle_type_uncatchable = 0x210
battle_type_double = 0x01
perish_song_status3 = 0x20
disable_struct_size = 0x1C
perish_timer = 0x0F
script_context_stack_depth = 0x00
script_context_stack = 0x0C
script_context_pointer = 0x08
species_info_size = 28
species_name_length = 11
species_count = 412                     # NUM_SPECIES
evolutions_per_species = 5              # EVOS_PER_MON
evolution_size = 8                      # struct Evolution
evolution_target = 4
primary_type = 6
item_size = 44
item_count = 377
item_pocket = 26
item_battle_usage = 32
ball_pocket = 2                         # POCKET_POKE_BALLS
pc_boxes = 14
pc_box_slots = 30
pc_boxes_offset = 4
trainer_id = 0x0A                      # in save block 2
play_time = 0x0E                       # in save block 2: hours, minutes, seconds, frames
badge_flags = 0x867                    # FLAG_BADGE01_GET: eight flags, one per badge
event_flags = 0x1270                   # in save block 1
trainer_size = 40
trainer_party_flags = 0
trainer_party_size = 32
trainer_party = 36
trainer_mon_level = 2
trainer_mon_sizes = [8, 16, 8, 16]
type_name_length = 7
balls_pocket = 0x650                   # in save block 1: bagPocket_PokeBalls
balls_pocket_slots = 16
dead_box = 14

[options.battle_style]
name = "Battle style"
menu = "OPTION > BATTLE STYLE"
save_block = 2
offset = 0x15
mask = 0x02
values = { shift = 0x00, set = 0x02 }

# Closes an Area: the ball is refused, and kept, with Dad's "time and place"
# line: the Bag's (both its "BOX is full" lines), and the Safari Zone's BALL
# (battle string 0x530/4), which gets a copy without the {PLAYER} placeholder
# battle text can't show, in free ROM.
[rules.catch_block]
method = "patch"
sites = [
  { at = 0x0806B8B0, expect = "10 B5 00 24", write = "01 20 70 47" },  # IsPlayerPartyAndPokemonStorageFull -> TRUE
  { at = 0x080FE3E8, expect = "25 91 5E 08", write = "31 8F 5E 08" },  # gText_BoxFull -> gText_DadsAdvice
  { at = 0x080FE400, expect = "25 91 5E 08", write = "31 8F 5E 08" },  # the same, the second time
  { at = 0x09F00800, expect = "FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF FF", write = "BE BB BE B4 E7 00 D5 D8 EA DD D7 D9 AD AD AD FE CE DC D9 E6 D9 B4 E7 00 D5 00 E8 DD E1 D9 00 D5 E2 D8 00 E4 E0 D5 D7 D9 00 DA E3 E6 FA D9 EA D9 E6 ED E8 DC DD E2 DB AB FB FF" },  # "DAD's advice... / There's a time and place for / everything!"
  { at = 0x085CC7A0, expect = "74 C0 5C 08", write = "00 08 F0 09" },  # the Safari BALL's line -> that copy
]

# The level-100 checks after `movs r1, #0x38` (MON_DATA_LEVEL); the first byte
# is the cap. Not the Day Care's (TakeSelectedPokemonFromDaycare): it has only
# the soft cap.
[rules.level_cap]
method = "patch"
sites = [
  { at = 0x0804A5BE, expect = "64 28" },  # Cmd_getexp
  { at = 0x0804A88E, expect = "64 28" },  # Cmd_getexp
  { at = 0x0806C17C, expect = "64 28" },  # PokemonUseItemEffects (Rare Candy)
  { at = 0x081B743A, expect = "64 28" },  # ItemUseCB_RareCandy
]

# BATTLE_TYPE_TRAINER added to the "items can't be used" mask in HandleTurnActionSelectionState.
[rules.no_items_trainer]
method = "patch"
sites = [{ at = 0x0803C258, expect = "02 09 1F 02", write = "0A 09 1F 02" }]

# Only Poké Balls keep a battle use in wild battles.
[rules.no_items_wild]
method = "zero_table_field"

[rules.set_mode]
method = "option_bit"
option = "battle_style"
value = "set"

# "Give a nickname?" is answered Yes, as in FireRed.
[rules.must_nickname]
method = "key_filter"
battle_script_pointer = 0x02024214   # gBattlescriptCurrInstr
command_table = 0x0831BD10           # gBattleScriptingCommandsTable
command = 0x08056BED                 # Cmd_trygivecaughtmonnick
battle_communication = 0x02024332
field_yes_no = [0x0827133B]          # Std_MsgboxYesNo, after its yesnobox
question = "give a nickname"

