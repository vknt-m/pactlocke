# Sync Gates: every gym leader, Elite Four member and the Champion, each by its
# trainerbattle instruction(s), found by `cargo dev scan` and checked against the
# ROM (the Champion has one per starter; the post-game rematches aren't gates).
# A closed gate's first 5 bytes become a goto to its hold script, written with
# the hold message into free ROM at `hold` (0xFF in a clean ROM).
[sync_gates]
hold = 0x08F00000

[[sync_gates.gates]]
name = "Brock"
sites = [{ at = 0x0816A5A0, expect = "5C 01 9E 01 00" }]

