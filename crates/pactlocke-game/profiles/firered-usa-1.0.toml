# The Gift and Static catalogue: each source's givemon, giveegg or
# setwildbattle instruction (found in the ROM and checked by the local
# acceptance test). A species from a script variable (the starter, the
# Fighting Dojo and Game Corner prizes) is one instruction for every pick.
# Not listed yet: in-game trades (detected as trades), and the event-ticket
# islands' Lugia, Ho-Oh and Deoxys. The Pokémon Tower ghost isn't a Static:
# nobody can catch it (see battle_type_uncatchable).

# Level cap stages, in order: each next gym leader, then each Elite Four member and
# the Champion. A gym stage is passed by badge count (Koga and Sabrina can come in
# either order); a League stage by its defeat flag. Trainer ids are pret's
# TRAINER_LEADER_* / TRAINER_ELITE_FOUR_* / TRAINER_CHAMPION_FIRST_* (one per starter).
