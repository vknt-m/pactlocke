# The Romhacks Pactlocke is tested on, as the app's tested list shows them:
# name, version and author, the game each patches (its Game Profile), and the
# patched ROM's SHA-1. Pactlocke hosts and links to nothing: a Player brings
# the patched ROM, and it is matched by SHA-1. A Romhack listed here plays once
# its own Game Profile is bundled; until then the app names
# it and says its profile is coming.

