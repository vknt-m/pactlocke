[package]
name = "pactlocke-app"
description = "Pactlocke: play GBA Pokemon challenge runs together."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "pactlocke"
path = "src/main.rs"

[dependencies]
cpal = "0.18.2"
eframe = { version = "0.37.0", default-features = false, features = ["wgpu", "default_fonts", "accesskit", "clipboard", "x11", "wayland"] }
pactlocke-emu = { path = "../pactlocke-emu" }
pactlocke-game = { path = "../pactlocke-game" }
pactlocke-mgba = { path = "../pactlocke-mgba" }
pactlocke-net = { path = "../pactlocke-net" }
pactlocke-run = { path = "../pactlocke-run" }
rfd = "0.18.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gilrs = "0.11"
png = "0.17"
log = { version = "0.4", features = ["std"] }
# iroh logs through tracing: with no tracing subscriber, its events reach `log`.
tracing = { version = "0.1", features = ["log"] }
