[workspace]
resolver = "3"
members = ["crates/pactlocke-emu", "crates/pactlocke-mgba", "crates/pactlocke-game", "crates/pactlocke-run", "crates/pactlocke-app", "crates/pactlocke-dev", "crates/pactlocke-net", "crates/pactlocke-randomizer"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

# A smaller, slightly faster app for a slower release build. Symbols are kept
# so a crash report still names its functions.
[profile.release]
lto = "thin"
codegen-units = 1

# The determinism check hashes ~100 MB per run; keep it quick in debug builds.
[profile.dev.package.sha2]
opt-level = 3
