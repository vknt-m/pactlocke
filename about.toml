# cargo-about: the licences the app's Rust crates may use, and how to read
# them. `cargo about generate` fails on a crate whose licence isn't accepted
# here, so a new dependency under an unvetted licence stops CI and the release.
# Every licence accepted here can be combined with the GPL-3.0-or-later.

accepted = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

# The platforms releases are built for.
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]

# Only what is in the app: not test-only crates, not build tools.
ignore-dev-dependencies = true
ignore-build-dependencies = true

# Pactlocke's own crates (publish = false) are covered by LICENSE.
private = { ignore = true }

# Crates whose licence files need help to be read correctly.
workarounds = ["ring", "rustls"]
